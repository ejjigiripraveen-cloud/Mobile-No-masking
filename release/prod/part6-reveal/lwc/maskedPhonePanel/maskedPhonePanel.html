<template>
    <lightning-card title={title} icon-name="standard:call">
        <div class="slds-p-horizontal_medium">
            <template lwc:if={isLoading}>
                <div class="spinner-holder">
                    <lightning-spinner size="small" alternative-text="Loading phone numbers"></lightning-spinner>
                </div>
            </template>
            <template lwc:elseif={errorMessage}>
                <p class="slds-text-color_error" role="alert" data-id="error">{errorMessage}</p>
            </template>
            <template lwc:elseif={hasRows}>
                <ul>
                    <template for:each={displayRows} for:item="row">
                        <li
                            key={row.fieldKey}
                            class="slds-grid slds-grid_vertical-align-center slds-wrap slds-p-vertical_xx-small"
                            data-field={row.fieldKey}
                        >
                            <span class="slds-col slds-size_1-of-3 slds-text-color_weak">{row.label}</span>
                            <span class="slds-col slds-size_2-of-3">
                                <template lwc:if={row.showDial}>
                                    <lightning-click-to-dial
                                        value={row.maskedNumber}
                                        record-id={recordId}
                                        params={row.params}
                                    ></lightning-click-to-dial>
                                </template>
                                <template lwc:elseif={row.showMasked}>
                                    <span class="masked-number" data-id="masked">{row.maskedNumber}</span>
                                    <lightning-icon
                                        icon-name="utility:call"
                                        size="xx-small"
                                        class="slds-m-left_x-small call-disabled"
                                        alternative-text={callHint}
                                        title={callHint}
                                    ></lightning-icon>
                                </template>
                                <template lwc:else>
                                    <span class="slds-text-color_weak" data-id="empty">{row.emptyText}</span>
                                </template>
                                <template lwc:if={row.showRevealButton}>
                                    <lightning-button-icon
                                        icon-name="utility:preview"
                                        variant="bare"
                                        size="small"
                                        class="slds-m-left_x-small"
                                        alternative-text={row.revealTitle}
                                        title={row.revealTitle}
                                        data-field={row.fieldKey}
                                        data-id="reveal"
                                        onclick={handleRevealClick}
                                    ></lightning-button-icon>
                                </template>
                            </span>
                            <template lwc:if={row.revealedNumber}>
                                <span class="slds-col slds-size_1-of-3"></span>
                                <span class="slds-col slds-size_2-of-3 revealed" data-id="revealed">
                                    <span class="revealed-number">{row.revealedNumber}</span>
                                    <span class="slds-text-color_weak slds-m-left_x-small">{row.revealedHint}</span>
                                </span>
                            </template>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak" data-id="none">No phone numbers configured.</p>
            </template>
        </div>
    </lightning-card>

    <template lwc:if={showRevealDialog}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="reveal-heading"
            class="slds-modal slds-fade-in-open"
            data-id="reveal-dialog"
        >
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="reveal-heading" class="slds-text-heading_medium">{revealHeading}</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-m-bottom_small">The number is shown for a short time and this reveal is recorded.</p>
                    <lightning-combobox
                        label="Reason"
                        placeholder="Choose a reason"
                        required
                        options={reasonOptions}
                        value={selectedReason}
                        onchange={handleReasonChange}
                        data-id="reason"
                    ></lightning-combobox>
                    <lightning-textarea
                        label="Comment"
                        required={isOtherReason}
                        max-length="1000"
                        value={revealComment}
                        onchange={handleCommentChange}
                        data-id="comment"
                    ></lightning-textarea>
                    <template lwc:if={revealError}>
                        <p class="slds-text-color_error slds-m-top_small" role="alert" data-id="reveal-error">{revealError}</p>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCancelReveal} data-id="cancel"></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Reveal"
                        class="slds-m-left_x-small"
                        disabled={revealDisabled}
                        onclick={handleConfirmReveal}
                        data-id="confirm"
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
